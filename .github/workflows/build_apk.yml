name: Build Android APK

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"

      - name: Install Flet
        run: pip install "flet>=0.27.0"

      - name: Build Android APK
        working-directory: mobile.apk
        run: flet build apk --yes

      - name: Rename APK
        run: cp mobile.apk/build/apk/app-release.apk Chiron-LIS-Simulator.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Chiron-LIS-Simulator-APK
          path: Chiron-LIS-Simulator.apk

      - name: Attach APK to GitHub Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Chiron-LIS-Simulator.apk
