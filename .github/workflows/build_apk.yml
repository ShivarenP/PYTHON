name: Build Android APK

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Install Flet
        run: pip install "flet>=0.27.0"

      - name: Build Android APK
        run: |
          APP_DIR=$(dirname "$(find . -maxdepth 3 -name "main.py" | head -n 1)")
          echo "Building Flet APK inside: $APP_DIR"
          cd "$APP_DIR"
          flet build apk --arch arm64-v8a --yes
          APK_FILE=$(find build/apk -name "*.apk" | head -n 1)
          echo "Copying generated APK: $APK_FILE"
          cp "$APK_FILE" "$GITHUB_WORKSPACE/Chiron-LIS-Simulator.apk"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Chiron-LIS-Simulator-APK
          path: Chiron-LIS-Simulator.apk

      - name: Attach APK to GitHub Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Chiron-LIS-Simulator.apk
